<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricera · Product demo</title>
    <meta name="description" content="Recorded walkthroughs of the real Pricera product: from a pricing document to governed prices, and from a technical drawing to a priced quote.">
    <link rel="canonical" href="https://www.pricera.site/demo/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pricera">
    <meta property="og:url" content="https://www.pricera.site/demo/">
    <meta property="og:title" content="Pricera · Product demo">
    <meta property="og:description" content="Recorded walkthroughs of the real Pricera product: from a pricing document to governed prices, and from a technical drawing to a priced quote.">
    <meta property="og:image" content="https://www.pricera.site/poster-demo-s1.jpg">
    <meta property="og:image:width" content="1440">
    <meta property="og:image:height" content="900">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pricera · Product demo">
    <meta name="twitter:description" content="Recorded walkthroughs of the real Pricera product: from a pricing document to governed prices, and from a technical drawing to a priced quote.">
    <meta name="twitter:image" content="https://www.pricera.site/poster-demo-s1.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='1.5' y='1.5' width='27' height='27' rx='8' fill='%23edf6f1' stroke='%23d5e8de'/%3E%3Cpath d='M13.2 11.4 10.6 18M16.8 11.4l2.6 6.6' stroke='%23216c56' stroke-width='1.7' stroke-linecap='round' opacity='.5'/%3E%3Ccircle cx='15' cy='8.8' r='2.9' fill='%23216c56'/%3E%3Ccircle cx='9.4' cy='20.6' r='2.9' fill='%23216c56' opacity='.5'/%3E%3Ccircle cx='20.6' cy='20.6' r='2.9' fill='%23216c56'/%3E%3C/svg%3E">
    <script>
    try {
      var t = localStorage.getItem('pricera-theme');
      var h = new Date().getHours();
      if (t ? t === 'dark' : (h >= 19 || h < 7)) document.documentElement.classList.add('dark');
    } catch (e) {}
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --paper: #f6f7f9;
            --surface: #ffffff;
            --surface-soft: #f7f9f8;
            --ink: #242d35;
            --ink-soft: #46515b;
            --muted: #737e88;
            --line: #e7ebef;
            --green: #216c56;
            --green-dark: #16533f;
            --mint: #edf6f1;
            --mint-line: #d5e8de;
            --radius: 18px;
        }
        html.dark {
            color-scheme: dark;
            --paper: #11161b;
            --surface: #1a2129;
            --surface-soft: #151c23;
            --ink: #e9eef2;
            --ink-soft: #b7c2cb;
            --muted: #8d99a4;
            --line: #2a343e;
            --green: #4fae8b;
            --green-dark: #6fd4ae;
            --mint: #1c2b25;
            --mint-line: #2f4a3e;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #05080b;
            color: #eef3f0;
            line-height: 1.55;
        }

        /* ---------- the film: video is the page background ---------- */
        #film {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; background: #05080b; z-index: 0;
        }
        .vignette {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background:
                linear-gradient(180deg, rgba(5,8,11,.55), transparent 20%, transparent 70%, rgba(5,8,11,.75));
        }

        /* ---------- chrome ---------- */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 5;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 22px;
        }
        .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand .mark { width: 28px; height: 28px; display: block; }
        .brand .word {
            font-family: 'Michroma', 'Inter', sans-serif; font-size: 15px;
            letter-spacing: .10em; color: #fff; text-transform: uppercase;
        }
        .films { display: flex; gap: 6px; }
        .films .film-tab {
            font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
            color: rgba(255,255,255,.72); background: rgba(10,15,19,.45);
            border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
            padding: 7px 15px; backdrop-filter: blur(8px);
            transition: color .2s, border-color .2s, background .2s;
        }
        .films .film-tab:hover { color: #fff; border-color: rgba(255,255,255,.4); }
        .films .film-tab.on { color: #fff; background: var(--green); border-color: transparent; }
        .films .film-tab .fd { font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: .7; margin-left: 5px; }
        .chrome-right { display: flex; gap: 8px; align-items: center; }
        .pill-btn {
            font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
            color: #fff; text-decoration: none;
            background: rgba(10,15,19,.45); border: 1px solid rgba(255,255,255,.16);
            border-radius: 999px; padding: 7px 15px; backdrop-filter: blur(8px);
            transition: border-color .2s, background .2s;
        }
        .pill-btn:hover { border-color: rgba(255,255,255,.4); }
        .pill-btn.sound.on { background: var(--green); border-color: transparent; }

        /* ---------- collapsible chapter outline, right edge ---------- */
        .outline {
            position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 5;
            width: 250px; max-height: 76vh; display: flex; flex-direction: column;
            background: rgba(10,15,19,.55); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.12); border-right: 0;
            border-radius: 14px 0 0 14px; overflow: hidden;
            transition: width .35s ease;
        }
        .outline.closed { width: 46px; }
        .o-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 12px 10px 16px; border-bottom: 1px solid rgba(255,255,255,.1);
        }
        .outline.closed .o-head { padding: 11px 0 10px; justify-content: center; border-bottom-color: transparent; }
        .o-head .o-lbl {
            font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em;
            text-transform: uppercase; color: rgba(255,255,255,.55); white-space: nowrap;
            transition: opacity .2s;
        }
        .outline.closed .o-head .o-lbl { display: none; }
        #o-toggle {
            flex: none; width: 22px; height: 22px; border: 0; cursor: pointer;
            background: none; color: rgba(255,255,255,.7); font-size: 14px; line-height: 1;
            transition: transform .35s, color .2s;
        }
        #o-toggle:hover { color: #fff; }
        .outline.closed #o-toggle { transform: rotate(180deg); }
        .o-list { overflow-y: auto; padding: 8px; scrollbar-width: thin; }
        .o-item {
            display: flex; align-items: baseline; gap: 8px; width: 100%;
            font: inherit; font-size: 12px; text-align: left; cursor: pointer;
            color: rgba(255,255,255,.62); white-space: nowrap;
            background: rgba(10,15,19,.45); border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px; padding: 9px 12px; margin-bottom: 6px;
            transition: color .2s, background .2s, border-color .2s;
        }
        .o-item:hover { color: #fff; border-color: rgba(255,255,255,.3); }
        .o-item .ix {
            flex: none; width: 22px; text-align: center;
            font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--green);
        }
        .o-item .lbl { overflow: hidden; text-overflow: ellipsis; transition: opacity .2s; }
        .o-item .tm {
            margin-left: auto; flex: none;
            font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: rgba(255,255,255,.4);
        }
        .outline.closed .o-item { padding: 8px 0; justify-content: center; }
        .outline.closed .o-item .lbl, .outline.closed .o-item .tm { display: none; }
        .o-item.on { color: #fff; background: rgba(33,108,86,.5); border-color: rgba(79,174,139,.5); }
        .o-item.on .ix, .o-item.on .tm { color: #9fe0c4; }

        /* ---------- current-chapter marker, bottom-center ---------- */
        .subtitle-wrap {
            position: fixed; left: 50%; transform: translateX(-50%); bottom: 30px; z-index: 4;
            text-align: center; pointer-events: none; max-width: min(720px, 86vw);
        }
        .subchap {
            font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .1em;
            text-transform: uppercase; color: var(--green);
            text-shadow: 0 1px 8px rgba(0,0,0,.9);
        }
        .replay {
            pointer-events: auto; display: none; margin-top: 12px;
        }
        body.ended .replay { display: inline-block; }

        /* ---------- big play state ---------- */
        .big-play {
            position: fixed; inset: 0; z-index: 4; display: none;
            align-items: center; justify-content: center; pointer-events: none;
        }
        body:not(.playing) .big-play { display: flex; }
        .big-play .bp {
            pointer-events: auto; width: 84px; height: 84px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,.35); background: rgba(10,15,19,.55);
            backdrop-filter: blur(10px); color: #fff; font-size: 26px; cursor: pointer;
            display: grid; place-items: center; transition: transform .2s, background .2s;
        }
        .big-play .bp:hover { transform: scale(1.06); background: var(--green); }

        /* ---------- scroll: film first, then CTA slides over ---------- */
        .spacer { height: 100vh; }
        .after { position: relative; z-index: 2; background: var(--paper); color: var(--ink); }
        .after .container { max-width: 1060px; margin: 0 auto; padding: 64px 24px; }
        .cta {
            padding: 28px 32px; border-radius: var(--radius);
            background: var(--green); color: #fff;
            display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
        }
        .cta h2 { font-size: 20px; margin-bottom: 4px; }
        .cta p { font-size: 14px; opacity: .85; max-width: 520px; }
        .cta a {
            background: #fff; color: var(--green-dark); font-weight: 700; font-size: 15px;
            text-decoration: none; padding: 12px 22px; border-radius: 999px; white-space: nowrap;
        }
        footer { border-top: 1px solid var(--line); padding: 28px 0; font-size: 13px; color: var(--muted); }

        @media (max-width: 860px) {
            .outline { max-height: 60vh; }
            .outline:not(.closed) { width: 210px; }
            .films .film-tab .fd { display: none; }
            .films .film-tab { padding: 7px 11px; font-size: 12px; }
            .subtitle-wrap { bottom: 18px; }
            .sub { font-size: 12.5px; }
        }
    </style>
</head>
<body>
    <video id="film" muted playsinline autoplay preload="metadata" poster="/poster-demo-journey.jpg"></video>
    <div class="vignette"></div>

    <header>
        <a href="/" class="brand" aria-label="Pricera">
            <svg class="mark" viewBox="0 0 30 30" aria-hidden="true">
                <rect x="1.5" y="1.5" width="27" height="27" rx="8" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.35)"/>
                <path d="M13.2 11.4 10.6 18M16.8 11.4l2.6 6.6" stroke="#4fae8b" stroke-width="1.7" stroke-linecap="round" opacity=".7"/>
                <circle cx="15" cy="8.8" r="2.9" fill="#4fae8b"/>
                <circle cx="9.4" cy="20.6" r="2.9" fill="#4fae8b" opacity=".7"/>
                <circle cx="20.6" cy="20.6" r="2.9" fill="#4fae8b"/>
            </svg>
            <span class="word">Pricera</span>
        </a>
        <div class="films" id="films">
            <button class="film-tab on" data-film="journey" type="button">Full journey<span class="fd">10:36</span></button>
            <button class="film-tab" data-film="drawing" type="button">Drawings → quote<span class="fd">3:22</span></button>
        </div>
        <div class="chrome-right">
            <a href="/" class="pill-btn" data-track="demo-back">← site</a>
        </div>
    </header>

    <aside class="outline" id="outline">
        <div class="o-head"><span class="o-lbl">chapters</span><button id="o-toggle" type="button" aria-label="Collapse chapters">‹</button></div>
        <div class="o-list" id="o-list"></div>
    </aside>

    <div class="subtitle-wrap">
        <div class="subchap" id="chap"></div>
        <button class="pill-btn replay" id="replay" type="button">↻ replay</button>
    </div>

    <div class="big-play"><button class="bp" id="bigplay" type="button" aria-label="Play">▶</button></div>

    <div class="spacer"></div>
    <div class="after">
        <div class="container">
            <div class="cta">
                <div>
                    <h2>Want to try it on your own use case?</h2>
                    <p>Selected users get access to a light version of the app — describe your pricing logic in a prompt and calculate prices on it.</p>
                </div>
                <a href="mailto:hello@pricera.site?subject=Demo%20access%20request" data-track="demo-request-access">Request access →</a>
            </div>
        </div>
        <footer><div class="container">© Pricera</div></footer>
    </div>

    <script>
    (function () {
      "use strict";
      var EP = "/t/";
      var loaded = Date.now();
      function payload(e, x) {
        var q = new URLSearchParams(location.search);
        return JSON.stringify({
          e: e, p: location.pathname + location.hash,
          r: document.referrer || null,
          l: navigator.language,
          tz: (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone,
          vw: window.innerWidth, vh: window.innerHeight,
          d: Date.now() - loaded,
          u: { us: q.get("utm_source"), um: q.get("utm_medium"), uc: q.get("utm_campaign") },
          x: x || null,
        });
      }
      function send(e, x) {
        var data = payload(e, x);
        if (navigator.sendBeacon) {
          navigator.sendBeacon(EP, new Blob([data], { type: "application/json" }));
        } else {
          fetch(EP, { method: "POST", body: data, keepalive: true, mode: "no-cors" });
        }
      }

      /* ---------- film manifests ---------- */
      var FILMS = {
        journey: {
          src: "/demo-journey.mp4", poster: "/poster-demo-journey.jpg",
          chapters: [
            { title: "Customers", seconds: 14.686 },
            { title: "The pricing document", seconds: 43.13 },
            { title: "AI reads the document", seconds: 67.429 },
            { title: "AI drafts the model", seconds: 94.833 },
            { title: "Verify, then publish", seconds: 119.706 },
            { title: "Inside the model", seconds: 168.122 },
            { title: "The product type", seconds: 189.712 },
            { title: "Strategy + rule", seconds: 222.81 },
            { title: "The first quote", seconds: 265.131 },
            { title: "Saved to the catalog", seconds: 339.707 },
            { title: "The next quote", seconds: 371.492 },
            { title: "A request by email", seconds: 421.349 },
            { title: "Prices move", seconds: 488.304 },
            { title: "The customer-facing quote", seconds: 542.698 },
            { title: "Deep dive — model in model", seconds: 556.608 },
          ],
        },
        drawing: {
          src: "/demo-quote-drawing.mp4", poster: "/poster-demo-drawing.jpg",
          chapters: [
            { title: "One costing formula", seconds: 13 },
            { title: "A request arrives with a drawing", seconds: 39 },
            { title: "The drawing becomes data", seconds: 74 },
            { title: "Priced", seconds: 166 },
          ],
        },
      };

      var vid = document.getElementById("film");
      var oList = document.getElementById("o-list");
      var outline = document.getElementById("outline");
      var chapEl = document.getElementById("chap");
      var replayBtn = document.getElementById("replay");
      var film = null, lastChap = -1;

      function fmtT(sec) {
        sec = Math.max(0, Math.round(sec));
        return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      }
      function chapterAt(t) {
        var i = -1;
        for (var k = 0; k < film.chapters.length; k++) if (film.chapters[k].seconds <= t + 0.05) i = k;
        return i;
      }

      function loadFilm(key) {
        film = FILMS[key]; lastChap = -1;
        document.body.classList.remove("ended");
        vid.poster = film.poster;
        vid.src = film.src;
        chapEl.textContent = "";
        document.querySelectorAll(".film-tab").forEach(function (b) {
          b.classList.toggle("on", b.getAttribute("data-film") === key);
        });
        oList.innerHTML = "";
        film.chapters.forEach(function (ch, i) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "o-item"; b.title = ch.title;
          b.innerHTML = '<span class="ix">' + String(i + 1).padStart(2, "0") + '</span><span class="lbl">' + ch.title + '</span><span class="tm">' + fmtT(ch.seconds) + "</span>";
          b.addEventListener("click", function () {
            vid.currentTime = ch.seconds + 0.02;
            vid.play().catch(function () {});
            send("chapter", { v: key, i: i + 1, title: ch.title });
          });
          oList.appendChild(b);
        });
        send("film", { v: key });
      }

      function render() {
        var t = vid.currentTime, i;
        var ch = chapterAt(t);
        if (ch !== lastChap) {
          lastChap = ch;
          chapEl.textContent = ch >= 0 ? film.chapters[ch].title : "";
          var kids = oList.children;
          for (i = 0; i < kids.length; i++) kids[i].classList.toggle("on", i === ch);
          if (ch >= 0 && kids[ch]) {
            oList.scrollTo({ top: kids[ch].offsetTop - oList.clientHeight / 2, behavior: "smooth" });
          }
        }
      }

      document.getElementById("bigplay").addEventListener("click", function () {
        vid.play().catch(function () {});
      });
      replayBtn.addEventListener("click", function () { vid.currentTime = 0; vid.play().catch(function () {}); });
      vid.addEventListener("click", function () { vid.paused ? vid.play().catch(function(){}) : vid.pause(); });
      vid.addEventListener("play", function () { document.body.classList.add("playing"); });
      vid.addEventListener("pause", function () { document.body.classList.remove("playing"); });
      vid.addEventListener("ended", function () { document.body.classList.remove("playing"); document.body.classList.add("ended"); });
      vid.addEventListener("timeupdate", render);
      document.getElementById("o-toggle").addEventListener("click", function () {
        outline.classList.toggle("closed");
      });
      if (window.innerWidth < 860) outline.classList.add("closed");
      document.querySelectorAll(".film-tab").forEach(function (b) {
        b.addEventListener("click", function () { loadFilm(b.getAttribute("data-film")); vid.play().catch(function(){}); });
      });

      send("pageview");
      vid.addEventListener("play", function once() {
        vid.removeEventListener("play", once);
        send("video_play", { src: (vid.currentSrc || "").split("/").pop() });
      });
      document.addEventListener("click", function (ev) {
        var el = ev.target.closest && ev.target.closest("[data-track]");
        if (el) send("click", { target: el.getAttribute("data-track"), href: el.href || null });
      });
      window.addEventListener("pagehide", function () { send("leave"); });

      loadFilm("journey");
      vid.play().catch(function () {}); // muted autoplay — ambient start
    })();
    </script>
</body>
</html>
